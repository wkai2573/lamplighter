name: Publish to Hub Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-hub
  cancel-in-progress: false

env:
  APP_NAME: lamplighter
  HUB_REPO: ${{ vars.HUB_REPO || 'wkai2573/hub' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HUB_REPO }}
          token: ${{ secrets.HUB_PUSH_TOKEN }}
          path: hub

      - name: Sync dist into hub
        run: |
          rm -rf "hub/apps/${APP_NAME}"
          mkdir -p "hub/apps/${APP_NAME}"
          cp -r dist/. "hub/apps/${APP_NAME}/"

      - name: Commit & push to hub
        working-directory: hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "apps/${APP_NAME}"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "deploy(${APP_NAME}): ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
